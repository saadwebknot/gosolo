services:
  web:
    restart: always
    build: .
    image: go-mysql-crud
    depends_on:
      - mysql
    environment:
      - DB_PORT=3306
      - DB_HOST=mysql
      - DB_NAME=go-mysql-crud
      - DB_PASS=12345
      - DB_USER=root
    ports:
      - "8005:8005"

  mysql:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=12345
      - MYSQL_DATABASE=go-mysql-crud
      - MYSQL_ROOT_HOST=%
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
